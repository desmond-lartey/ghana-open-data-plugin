# Ghana Open Data: the public documentation and community site.
#
# This repository (ghana-open-data-plugin) is published from the project's
# main repository: the docs/ folder, this file and the templates are copied
# here on every change, so edit them there. community/datasets/ belongs to
# this repository; it holds the datasets the review team has approved.

site_name: Ghana Open Data
site_description: >-
  Open data, statistics and maps: how to find, map, analyse and
  share data with the Ghana Open Data portal and its GIS workspace.
site_author: Ghana Open Data
site_url: https://desmond-lartey.github.io/ghana-open-data-plugin/

repo_url: https://github.com/desmond-lartey/ghana-open-data-plugin
repo_name: Community & feedback
edit_uri: ""

copyright: >-
  Documentation © Ghana Open Data contributors, CC BY 4.0. Data remains under
  the licence of its producer, shown on each dataset's page.

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: material/account-group
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  # Questions and comments under each page (giscus, stored as GitHub
  # Discussions in this repository). Fill in repo_id and category_id from
  # https://giscus.app; until then no comment box is shown.
  giscus:
    repo: desmond-lartey/ghana-open-data-plugin
    repo_id: "R_kgDOVxRSSQ"
    category: "Q&A"
    category_id: "DIC_kwDOVxRSSc4DL5oZ"
  social:
    - icon: material/web
      link: https://www.ghanaopendata.com
      name: The portal
    - icon: material/account-group
      link: https://github.com/desmond-lartey/ghana-open-data-plugin
      name: Community & feedback

hooks:
  - hooks/community.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Using the portal:
      - using/index.md
      - Finding data: using/finding-data.md
      - Statistics: using/statistics.md
      - Map explorer: using/map-explorer.md
      - Regions and districts: using/regions.md
      - Data Lab (SQL): using/data-lab.md
      - Desmond, the guide: using/desmond.md
      - Your account: using/account.md
  - GIS workspace:
      - gis/index.md
      - Ghana's data in the workspace: gis/ghana-data.md
      - Earth Engine: gis/earth-engine.md
      - Analysis-ready data: gis/analysis-ready.md
  - Share data:
      - share/index.md
      - How to submit: share/how-to-submit.md
      - How we review: share/review.md
      - Describing your data: share/metadata.md
      - Community catalogue: share/catalogue.md
  - Data & sources:
      - data/index.md
      - Keeping data fresh: data/freshness.md
      - Licences and citing: data/licences.md
      - For developers: data/developers.md
  - About:
      - about/index.md
      - Privacy: about/privacy.md
      - FAQ: about/faq.md
      - Changelog: about/changelog.md

name: Problem with the portal or workspace
description: Something does not work as it should
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Where?
      description: The page, or the GIS workspace menu, where it happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: What you did, what happened, and what you expected. Screenshots help.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome on Windows, Safari on iPhone…
